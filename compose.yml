services:
  backend:
    build:
      context: .
      target: backend
    environment:
      HOMORA_WEB_PORT: '8080'
    volumes:
      - homora-data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: .
      target: frontend
    ports:
      - '${HOMORA_BIND_IP:-127.0.0.1}:8080:80'
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  homora-data:
