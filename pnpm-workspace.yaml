packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: true
# better-auth declares optional peers (drizzle-orm, kysely). Without this, pnpm installs a second
# drizzle-orm copy for the backend and its SQL types stop matching those of @homora/db.
dedupePeers: true
autoInstallPeers: false
# VitePress 1.x still requests Vite 5; use the patched Vite 6 line until it upgrades.
# drizzle-kit's legacy loader also pins an esbuild version with a vulnerable dev server.
overrides:
  'vitepress>vite': 6.4.6
  '@esbuild-kit/core-utils>esbuild': 0.25.12
