# Run published images: HOMORA_VERSION=1.0.0 docker compose -f compose.release.yml up -d
services:
  backend:
    image: ghcr.io/jhonatanmedeiros/homora:${HOMORA_VERSION:-latest}
    environment:
      HOMORA_ALLOWED_ORIGINS: ${HOMORA_ALLOWED_ORIGINS:-}
      HOMORA_PASSKEY_RP_ID: ${HOMORA_PASSKEY_RP_ID:-}
      HOMORA_LOG_LEVEL: ${HOMORA_LOG_LEVEL:-info}
      HOMORA_TRUSTED_PROXY: ${HOMORA_TRUSTED_PROXY:-127.0.0.1}
    ports:
      - '${HOMORA_BIND_IP:-127.0.0.1}:8080:8080'
    volumes:
      - homora-data:/app/data
    restart: unless-stopped
volumes:
  homora-data:
