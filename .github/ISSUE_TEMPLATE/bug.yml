name: Bug report
description: Report something that does not work as expected.
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not post passwords, tokens, private addresses,
        screenshots of real infrastructure, or other personal information. Use synthetic examples.
        Report vulnerabilities privately using [SECURITY.md](https://github.com/JhonatanMedeiros/homora/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide minimal, repeatable steps using example data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Homora version or commit
      description: Find the version in the profile menu, if available.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and additional context
      description: Include installation method, operating system, browser, and relevant sanitized logs if known.
