name: Feature request
description: Suggest an improvement to Homora.
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Avoid sharing real infrastructure details or personal data.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task or difficulty and who experiences it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed improvement
      description: Explain your idea and what a successful outcome would look like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and additional context
      description: Describe any alternatives, workarounds or relevant examples.
