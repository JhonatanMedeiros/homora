version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /
    commit-message:
      prefix: deps
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: deps
    schedule:
      interval: weekly
