name: Release
# Publishes images after Release Please or a manual rerun for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun scripts/check-release-version.mjs
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
  # Each platform builds on a native runner and pushes by digest. The merge job
  # then assembles the multi-arch tags, so no QEMU emulation is needed.
  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: homora, image: homora, platform: linux/amd64, runner: ubuntu-26.04 }
          - { target: homora, image: homora, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - {
              target: discovery-agent,
              image: homora-discovery-agent,
              platform: linux/amd64,
              runner: ubuntu-26.04,
            }
          - {
              target: discovery-agent,
              image: homora-discovery-agent,
              platform: linux/arm64,
              runner: ubuntu-24.04-arm,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The tag is vX.Y.Z; the image version label has no leading "v".
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - id: about
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            homora)
              title='Homora'
              description='Self-hosted home page for your homelab: organize services, monitor their health, connect Proxmox and Docker, and let AI agents propose changes that only you can approve.' ;;
            discovery-agent)
              title='Homora discovery agent'
              description='Sends the labels of the Docker containers on a host to Homora, so they can be suggested as cards.' ;;
            *) echo "Unknown target: $TARGET" >&2; exit 1 ;;
          esac
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"
      - id: pair
        run: echo "name=${{ matrix.target }}-${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"
      # Registry names must be lowercase, and the owner keeps its capitals (metadata-action
      # lowercases for us, but the raw `outputs:` below does not).
      - id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # The defaults come from the workflow ref and the repository, so a run started from
          # `main` for an older tag would label the image with the wrong version and commit, and
          # both images would share one title and description.
          labels: |
            org.opencontainers.image.title=${{ steps.about.outputs.title }}
            org.opencontainers.image.description=${{ steps.about.outputs.description }}
            org.opencontainers.image.version=${{ steps.commit.outputs.version }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HOMORA_BUILD_COMMIT=${{ steps.commit.outputs.sha }}
            HOMORA_RELEASE_TAG=${{ inputs.tag }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ steps.pair.outputs.name }}
          cache-to: type=gha,scope=${{ steps.pair.outputs.name }},mode=max,ignore-error=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ steps.pair.outputs.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: homora, image: homora }
          - { target: discovery-agent, image: homora-discovery-agent }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}
      - name: Create multi-arch tags
        env:
          OWNER: ${{ github.repository_owner }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          IMAGE="ghcr.io/${OWNER,,}/${{ matrix.image }}"
          tag_args=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tag_args $(printf "$IMAGE@sha256:%s " *)
      - name: Verify published tags
        run: |
          set -euo pipefail
          fail=0
          for tag in $(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            raw=$(docker buildx imagetools inspect --raw "$tag")
            for arch in amd64 arm64; do
              if ! jq -e --arg a "$arch" '.manifests | any(.platform.os == "linux" and .platform.architecture == $a)' <<< "$raw" > /dev/null; then
                echo "::error::$tag is missing linux/$arch"
                fail=1
              fi
            done
            if ! jq -e '.manifests | any(.platform.architecture == "unknown")' <<< "$raw" > /dev/null; then
              echo "::error::$tag has no provenance/SBOM attestations"
              fail=1
            fi
            echo "checked $tag"
          done
          exit $fail
