name: Prepare release
on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-please-main
  cancel-in-progress: false
jobs:
  prepare:
    # A manual run prepares the PR. Only a merged, same-repository release PR
    # runs automatically; ordinary PR closures do not use a runner.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'release-please--branches--main')
    runs-on: ubuntu-26.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check release credential
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo 'RELEASE_PLEASE_TOKEN is not configured.' >&2
            exit 1
          fi
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
  images:
    needs: prepare
    if: ${{ needs.prepare.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag_name }}
