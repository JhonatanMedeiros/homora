name: Prepare release
on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-please-main
  cancel-in-progress: false
jobs:
  prepare:
    # A manual run prepares the PR. Only a merged, same-repository release PR
    # runs automatically; ordinary PR closures do not use a runner.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'release-please--branches--main')
    runs-on: ubuntu-26.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check release credential
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo 'RELEASE_PLEASE_TOKEN is not configured.' >&2
            exit 1
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
  images:
    needs: prepare
    if: ${{ needs.prepare.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag_name }}
  # The release is created as a draft so that nobody sees it before its images exist; it is
  # published only after both images were pushed and verified. If an image job fails, the draft
  # stays: rerun the Release workflow for the tag, then publish the draft by hand.
  publish-release:
    needs: [prepare, images]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag_name }}
        run: |
          # A draft is not returned by the "release by tag" endpoint, so look it up in the list.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          test -n "$id"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false
