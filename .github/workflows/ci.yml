name: CI
on:
  pull_request:
    branches:
      - main
  # Pushes to main run only the Docker job, which refreshes the image layer cache that pull
  # requests can read (a cache is visible to its own branch and to the default branch).
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Optional Turborepo Remote Cache. Without them Turborepo uses only the local cache.
  # The token is not available to pull requests from forks.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  # The team slug is not sensitive, so a variable is preferred, but a secret works too.
  TURBO_TEAM: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  type-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm type-check

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: test (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The tests import the compiled workspace packages.
      - run: pnpm build
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/3
      # The script tests are small, so they run once, with the first shard.
      - if: matrix.shard == 1
        run: node --test scripts/test/*.test.mjs

  # Aggregates the checks above under the name "validate", so a branch protection rule that
  # requires it keeps working.
  validate:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [lint, format, type-check, test]
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo "lint=${{ needs.lint.result }} format=${{ needs.format.result }} type-check=${{ needs.type-check.result }} test=${{ needs.test.result }}"
          test "${{ needs.lint.result }}${{ needs.format.result }}${{ needs.type-check.result }}${{ needs.test.result }}" = "successsuccesssuccesssuccess"

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm docs:build

  docker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: homora
          push: false
          cache-from: type=gha,scope=homora
          cache-to: type=gha,scope=homora,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: discovery-agent
          push: false
          cache-from: type=gha,scope=discovery-agent
          cache-to: type=gha,scope=discovery-agent,mode=max
