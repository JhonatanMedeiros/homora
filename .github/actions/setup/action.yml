name: Set up Homora
description: Install Bun and the dependencies, and restore the Turborepo cache.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - run: bun install --frozen-lockfile
      shell: bash
    # Without a complete Remote Cache configuration (forks, or before it is set up), keep the
    # local cache between runs of the same branch. With it, Turborepo shares results across branches.
    - if: ${{ env.TURBO_TOKEN == '' || env.TURBO_TEAM == '' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-
          turbo-${{ runner.os }}-
